name: Check student research code
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic unit tests (not scientific findings)
        run: python -m unittest discover -s tests -v
      - name: Parse static JavaScript
        run: |
          node --check site/data-view.js
          node --check site/motion.js
          node --check site/results.js
      - name: Check required website IDs and unfilled data status
        run: python scripts/check_site_contract.py
